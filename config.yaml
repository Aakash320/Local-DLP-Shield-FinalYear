vector_db:
  path: data/chroma
  collection: confidential_chunks

models:
  ollama_url: "http://127.0.0.1:11434"
  chat_model: "llama3.2:3b"
  embedding_model: ""

detection:
  keywords:
    - confidential
    - internal use only
    - do not distribute
    - proprietary
    - trade secret
  entropy:
    min_length: 20
    threshold: 4.5   # placeholder, tune in step 8
  llm:
    timeout_seconds: 30.0
    max_chars: 2000